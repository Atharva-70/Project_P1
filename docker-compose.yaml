services:

  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Atharva@123
      MYSQL_DATABASE: expense_portal_db
    ports:
      - "3307:3306"
    volumes:
      - expense-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pAtharva@123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: expense-app
    ports:
      - "5000:5000"
    environment:
      FLASK_SECRET_KEY: SUPER-SECRET-KEY
      DB_USER: root
      DB_PASSWORD: Atharva@123
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: expense_portal_db
      JWT_SECRET_KEY: SUPER-SECRET-KEY
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  expense-mysql-data:
    external: true