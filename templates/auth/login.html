{% extends "base.html" %}
{% block title %}Login - ExpenseFlow{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
  <div class="content-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 class="page-title" style="font-size: 24px; margin-bottom: 8px;">Sign In to ExpenseFlow</h1>
      <p style="color: var(--text-muted); font-size: 13px;">Enter credentials</p>
    </div>

    <form method="POST" action="{{ url_for('ui.login') }}">
      <div class="form-group">
        <label class="form-label" for="email">Corporate Email</label>
        <input type="email" id="email" name="email" class="form-control" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"  required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 8px;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('ui.register') }}">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
