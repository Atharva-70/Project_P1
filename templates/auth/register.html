{% extends "base.html" %}
{% block title %}Register - ExpenseFlow{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto;">
  <div class="content-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 class="page-title" style="font-size: 24px; margin-bottom: 8px;">Create Employee Account</h1>
      <p style="color: var(--text-muted); font-size: 13px;">Register for the corporate expense and travel portal</p>
    </div>

    <form method="POST" action="{{ url_for('ui.register') }}">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" class="form-control"  required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" class="form-control"  required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Corporate Email</label>
        <input type="email" id="email" name="email" class="form-control"  required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"  required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 8px;">
        Register Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('ui.login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
