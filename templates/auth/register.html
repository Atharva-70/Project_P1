{% extends "base.html" %}
{% block title %}Register - Expense Portal{% endblock %}

{% block content %}
<div class="auth-wrapper auth-wrapper--wide">
  <div class="content-card">
    <div class="auth-header">
      <h1 class="auth-title">Create Account</h1>
    </div>

    <form method="POST" action="{{ url_for('ui.register') }}">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" class="form-control" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" class="form-control" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Corporate Email</label>
        <input type="email" id="email" name="email" class="form-control" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">
        Register Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('ui.login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
